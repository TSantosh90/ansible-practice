- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: mysql,ansible,zip,nginx
    tagsMap:
     name: ansible 
     project: Roboshop
     component: catalogue
    tagsList: [
        {
            "key": "name",
            "value": "ansible"
        },
        {
            "key": "project",
            "value": "Roboshop"
        },
        {
            "key": "component",
            "value": "catalogue"
        }
    ]      
  tasks:
  - name: greetings
    ansible.builtin.debug:
     msg: " Hi Santosh kumar, {{ GREETINGS | default('good morning') }}"

  - name: convert string to list
    ansible.builtin.debug:
     msg: "{{ topics | split(',') }}"

  - name: convert map to list
    ansible.builtin.debug:
     msg: "{{ tagsMap | dict2items }}"

  - name: convert list to map
    ansible.builtin.debug:
     msg: "{{ tagsList | items2dict }}"

  - name: read students yaml
    ansible.builtin.set_fact:   # setting variable
      student_yaml: "{{ lookup('file', 'students.yaml' ) | from_yaml }}"

  - name: convert json to yaml
    ansible.builtin.debug:
     msg: "{{ student_yaml | to_nice_json }}"
    
- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: mysql,ansible,zip,nginx
    tagsList:
     name: ansible 
     project: Roboshop
     component: catalogue
  tasks:
  - name: greetings
    ansible.builtin.debug:
     msg: " Hi Santosh kumar, {{ GREETINGS | default('good morning') }}"

  - name: convert string to list
    ansible.builtin.debug:
     msg: "{{ topics | split(',') }}"

  - name: convert map to list
    ansible.builtin.debug:
     msg: "{{ tags | dict2items }}"
- name: check the shell vs command module
  hosts: local
  connection: local
  tasks:
   - name: check command module
     #ansible.builtin.command: cat /etc/passwd | grep root
     ansible.builtin.shell: cat /etc/passwd | grep root
     register: user_output

     ansible.builtin.shell: cat /etc/passwd | grep root
     register: user_output

   - name: print user_output
     ansible.builtin.debug:
      msg: "{{ user_output }}"

   - name: check command module
     #ansible.builtin.command: cat /etc/passwd | grep root
     ansible.builtin.shell: ls-ltr > files.txt
     register: files_output

   - name: print output for files
     ansible.builtin.debug:
      msg: "{{ files_output }}"
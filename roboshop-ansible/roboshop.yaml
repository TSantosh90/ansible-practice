#command : ansible-playbook -i localhost, -e '{"instances":["mongodb","catalogue","redis","mysql","payment","shipping","user","cart","rabbitmq","payment","frontend"]}' roboshop.yaml

- name: create ec2 instance and r53 records 
  hosts: all
  connection: local
  vars:
    sg_id: sg-03397cf5cc6b4017f 
    ami_id: ami-0220d79f3f480ecf5
    domain_name: santoshdevops.online
    env: dev
    action: create
    instances:
     - mongodb
     - catalogue
  tasks: 
  - name: create ec2 instance 
    amazon.aws.ec2_instance:
      instance_type: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      name: "{{item }}"
      wait: false
      tags:
        Project: Roboshop
        Component: "{{ item }}"
        Environment: "{{ env }}"
        Name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: print the ec2_output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"

  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: false
      overwrite: true
    loop: "{{ ec2_output.results }}"

  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "roboshop-{{ env }}.{{ domain_name }}" #roboshop-dev.santoshdevops.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      wait: false
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: item.item == "frontend"

### DELETE r53 Records 
  - name: delete r53 records
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}-{{ env }}.{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: false
    loop: "{{ instances }}"
    when: action == "destroy"

  - name: delete ec2_instance
    amazon.aws.ec2_instance:
      state: absent
      name: "{{ item }}-{{ env }}"
      wait: false 
    loop: "{{ instances }}"
    when: action == "destroy"
